name: Synthetic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check syntax and synthetic tests
        run: python scripts/check.py

  windows_one:
    name: Python 3.12 / windows-latest / shard 1 of 2
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      checked_sha: ${{ steps.plan.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify complete discovery and both shard memberships
        id: plan
        shell: pwsh
        run: |
          $raw = python scripts/check.py --shard-count 2 --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $raw | ConvertFrom-Json
          "plan_digest=$($plan.plan_digest)" >> $env:GITHUB_OUTPUT
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "checked_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Check syntax and synthetic shard 1
        run: python scripts/check.py --shard-index 1 --shard-count 2 --expected-plan-digest '${{ steps.plan.outputs.plan_digest }}'

  windows_two:
    name: Python 3.12 / windows-latest / shard 2 of 2
    runs-on: windows-latest
    timeout-minutes: 30
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      checked_sha: ${{ steps.plan.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify complete discovery and both shard memberships
        id: plan
        shell: pwsh
        run: |
          $raw = python scripts/check.py --shard-count 2 --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $raw | ConvertFrom-Json
          "plan_digest=$($plan.plan_digest)" >> $env:GITHUB_OUTPUT
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "checked_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Check syntax and synthetic shard 2
        run: python scripts/check.py --shard-index 2 --shard-count 2 --expected-plan-digest '${{ steps.plan.outputs.plan_digest }}'

  windows_gate:
    name: Python 3.12 / windows-latest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [windows_one, windows_two]
    if: ${{ always() }}
    steps:
      - name: Require both shards and the same complete coverage plan
        shell: python
        env:
          SHARD_ONE_RESULT: ${{ needs.windows_one.result }}
          SHARD_TWO_RESULT: ${{ needs.windows_two.result }}
          PLAN_ONE: ${{ needs.windows_one.outputs.plan_digest }}
          PLAN_TWO: ${{ needs.windows_two.outputs.plan_digest }}
          SHA_ONE: ${{ needs.windows_one.outputs.checked_sha }}
          SHA_TWO: ${{ needs.windows_two.outputs.checked_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          import os
          results = [os.environ['SHARD_ONE_RESULT'], os.environ['SHARD_TWO_RESULT']]
          first, second = os.environ['PLAN_ONE'], os.environ['PLAN_TWO']
          expected = os.environ['EXPECTED_SHA']
          same_head = bool(expected) and os.environ['SHA_ONE'] == os.environ['SHA_TWO'] == expected
          allowed = results == ['success', 'success'] and bool(first) and first == second and same_head
          print(f"Windows shards: {results}; identical nonempty coverage plans: {bool(first) and first == second}")
          print(f"Both checked the expected commit: {same_head}")
          raise SystemExit(0 if allowed else 1)
