name: Synthetic checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  visual_assets:
    name: Reproducible local visual assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Install exact visual dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify full and single-entry generated assets
        run: |
          node frontend/build.mjs
          git diff --exit-code -- static/vendor/visual
          node frontend/build.mjs --entry globe
          git diff --exit-code -- static/vendor/visual
  native_release:
    name: Source ZIP / Python 3.14 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            lock: linux
          - os: windows-latest
            lock: windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.14.10"
      - name: Install the exact target lock
        run: python -m pip install --require-hashes -r server/requirements-${{ matrix.lock }}-cp314.lock
      - name: Check deployment CLI and HTTP contracts
        run: python -m unittest tests.test_deployment -v
      - name: Build and exercise the actual source ZIP
        shell: python
        run: |
          import json, os, pathlib, subprocess, sys, tempfile
          root = pathlib.Path.cwd()
          work = pathlib.Path(tempfile.mkdtemp(prefix='source-release-ci-'))
          built = subprocess.check_output([sys.executable, 'scripts/build_server.py', '--output', str(work / 'output'), '--cache', str(work / 'cache')], text=True)
          info = json.loads(built)
          sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert info['source_commit'] == sha == os.environ['GITHUB_SHA'] and not info['source_dirty']
          subprocess.run([sys.executable, 'scripts/verify_server.py', info['zip']], check=True)
          subprocess.run([sys.executable, 'scripts/check_server_release.py', '--package', info['zip'], '--evidence', str(work / '中文 空格验收')], check=True)

  check:
    name: Python 3.12 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            timeout_minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Check selection DOM events and authenticated HTTP persistence
        working-directory: scripts
        run: |
          node --version
          npm ci --ignore-scripts
          node check_selection_entry.js
          node check_search_recovery.js
          node check_reading_attention.js
          python check_selection_http.py
          python check_handoffs_http.py
      - name: Check syntax and synthetic tests
        run: python scripts/check.py

  windows_one:
    name: Python 3.12 / windows-latest / shard 1 of 3
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      checked_sha: ${{ steps.plan.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify complete discovery and all three shard memberships
        id: plan
        shell: pwsh
        run: |
          $raw = python scripts/check.py --shard-count 3 --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $raw | ConvertFrom-Json
          "plan_digest=$($plan.plan_digest)" >> $env:GITHUB_OUTPUT
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "checked_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Check syntax and synthetic shard 1
        run: python scripts/check.py --shard-index 1 --shard-count 3 --expected-plan-digest '${{ steps.plan.outputs.plan_digest }}'

  windows_two:
    name: Python 3.12 / windows-latest / shard 2 of 3
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      checked_sha: ${{ steps.plan.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify complete discovery and all three shard memberships
        id: plan
        shell: pwsh
        run: |
          $raw = python scripts/check.py --shard-count 3 --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $raw | ConvertFrom-Json
          "plan_digest=$($plan.plan_digest)" >> $env:GITHUB_OUTPUT
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "checked_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Check syntax and synthetic shard 2
        run: python scripts/check.py --shard-index 2 --shard-count 3 --expected-plan-digest '${{ steps.plan.outputs.plan_digest }}'

  windows_three:
    name: Python 3.12 / windows-latest / shard 3 of 3
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      plan_digest: ${{ steps.plan.outputs.plan_digest }}
      checked_sha: ${{ steps.plan.outputs.checked_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install application dependencies
        run: python -m pip install -r requirements-test.txt
      - name: Verify complete discovery and all three shard memberships
        id: plan
        shell: pwsh
        run: |
          $raw = python scripts/check.py --shard-count 3 --plan
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $plan = $raw | ConvertFrom-Json
          "plan_digest=$($plan.plan_digest)" >> $env:GITHUB_OUTPUT
          $sha = git rev-parse HEAD
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "checked_sha=$sha" >> $env:GITHUB_OUTPUT
      - name: Check syntax and synthetic shard 3
        run: python scripts/check.py --shard-index 3 --shard-count 3 --expected-plan-digest '${{ steps.plan.outputs.plan_digest }}'

  windows_gate:
    name: Python 3.12 / windows-latest
    runs-on: ubuntu-latest
    timeout-minutes: 2
    needs: [windows_one, windows_two, windows_three]
    if: ${{ always() }}
    steps:
      - name: Require all three shards and the same complete coverage plan
        shell: python
        env:
          SHARD_ONE_RESULT: ${{ needs.windows_one.result }}
          SHARD_TWO_RESULT: ${{ needs.windows_two.result }}
          SHARD_THREE_RESULT: ${{ needs.windows_three.result }}
          PLAN_ONE: ${{ needs.windows_one.outputs.plan_digest }}
          PLAN_TWO: ${{ needs.windows_two.outputs.plan_digest }}
          PLAN_THREE: ${{ needs.windows_three.outputs.plan_digest }}
          SHA_ONE: ${{ needs.windows_one.outputs.checked_sha }}
          SHA_TWO: ${{ needs.windows_two.outputs.checked_sha }}
          SHA_THREE: ${{ needs.windows_three.outputs.checked_sha }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          import os
          results = [os.environ[f'SHARD_{index}_RESULT'] for index in ('ONE', 'TWO', 'THREE')]
          plans = [os.environ[f'PLAN_{index}'] for index in ('ONE', 'TWO', 'THREE')]
          same_plan = bool(plans[0]) and len(set(plans)) == 1
          expected = os.environ['EXPECTED_SHA']
          same_head = bool(expected) and all(os.environ[f'SHA_{index}'] == expected for index in ('ONE', 'TWO', 'THREE'))
          allowed = results == ['success'] * 3 and same_plan and same_head
          print(f"Windows shards: {results}; identical nonempty coverage plans: {same_plan}")
          print(f"All three checked the expected commit: {same_head}")
          raise SystemExit(0 if allowed else 1)
